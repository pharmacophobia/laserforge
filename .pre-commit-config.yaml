repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-ast          # Catches Python syntax errors BEFORE commit
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ['--maxkb=5000']
  - repo: local
    hooks:
      - id: unittest-smoke
        name: LaserForge smoke tests (core only)
        entry: python3 -m unittest discover tests -p 'test_laserforge.py' -q
        language: system
        pass_filenames: false
        always_run: true
