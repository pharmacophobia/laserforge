<svg width="100mm" height="100mm" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Test Cut & Engrave Calibration Target -->
  <!-- Outer calibration square: 80x80 mm -->
  <rect x="10" y="10" width="80" height="80" rx="5" fill="none" stroke="#000000" stroke-width="1" />

  <!-- Inner center circle: 40mm diameter -->
  <circle cx="50" cy="50" r="20" fill="none" stroke="#FF2A2A" stroke-width="1" />

  <!-- Diagonal crosshairs -->
  <line x1="15" y1="15" x2="85" y2="85" stroke="#1E90FF" stroke-width="1" />
  <line x1="85" y1="15" x2="15" y2="85" stroke="#1E90FF" stroke-width="1" />

  <!-- Corner alignment fiducials -->
  <circle cx="15" cy="15" r="2" fill="none" stroke="#FF2A2A" stroke-width="1" />
  <circle cx="85" cy="15" r="2" fill="none" stroke="#FF2A2A" stroke-width="1" />
  <circle cx="15" cy="85" r="2" fill="none" stroke="#FF2A2A" stroke-width="1" />
  <circle cx="85" cy="85" r="2" fill="none" stroke="#FF2A2A" stroke-width="1" />
</svg>
